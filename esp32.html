<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能垃圾桶实时监测系统</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f3f5f8;
      color: #1f2937;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .header h1 { font-size: 20px; font-weight: 600; }
    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
      background: #dcfce7;
      color: #166534;
    }
    .badge.error { background: #fee2e2; color: #991b1b; }
    .bin-visual {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 20px 0 28px;
    }
    .bin-lid {
      width: 148px;
      height: 12px;
      background: #9ca3af;
      border-radius: 6px 6px 2px 2px;
      margin-bottom: 4px;
    }
    .bin-body {
      width: 136px;
      height: 180px;
      border: 4px solid #9ca3af;
      border-top: none;
      border-radius: 0 0 16px 16px;
      position: relative;
      overflow: hidden;
      background: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bin-fill {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0%;
      background: #22c55e;
      transition: height 0.6s ease, background-color 0.4s ease;
    }
    .bin-pct-text {
      position: relative;
      z-index: 2;
      font-size: 32px;
      font-weight: 700;
      color: #111827;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
    }
    .card-label { font-size: 13px; color: #64748b; margin-bottom: 6px; }
    .card-value { font-size: 20px; font-weight: 600; color: #0f172a; }
    .footer {
      text-align: center;
      font-size: 12px;
      color: #64748b;
    }
    .status-msg {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      background: #fef3c7;
      color: #92400e;
      display: none;
    }
    button {
      margin-top: 12px;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: #ffffff;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>智能垃圾桶 (bin01)</h1>
      <span id="sysStatus" class="badge">等待连接</span>
    </div>

    <div class="bin-visual">
      <div class="bin-lid"></div>
      <div class="bin-body">
        <div id="binFill" class="bin-fill"></div>
        <div id="pctText" class="bin-pct-text">--%</div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="card-label">剩余高度 (dist)</div>
        <div id="distVal" class="card-value">-- mm</div>
      </div>
      <div class="card">
        <div class="card-label">电池电压 (vbat)</div>
        <div id="vbatVal" class="card-value">-- mV</div>
      </div>
      <div class="card">
        <div class="card-label">Wi-Fi 信号 (rssi)</div>
        <div id="rssiVal" class="card-value">-- dBm</div>
      </div>
      <div class="card">
        <div class="card-label">传感器状态 (err)</div>
        <div id="errVal" class="card-value">--</div>
      </div>
    </div>

    <div class="footer">
      <div id="updateTime">上次更新：尚未获取</div>
      <div id="errorBox" class="status-msg"></div>
      <button onclick="fetchData()">立即刷新数据</button>
    </div>
  </div>

  <script>
    const PRODUCT_ID = "8BpH28Wt16";
    const DEVICE_NAME = "bin01";
    // 如果接口提示权限不足，请在这里替换成你的产品级或用户级 Token
    const TOKEN = "version=2018-10-31&res=products%2F8BpH28Wt16%2Fdevices%2Fbin01&et=1893427200&method=sha1&sign=uVsW6Gnc%2FJ19nk6O4Ym5j8YItQ0%3D";

    async function fetchData() {
      const errorBox = document.getElementById("errorBox");
      const statusBadge = document.getElementById("sysStatus");
      const url = `https://iot-api.heclouds.com/thingmodel/query-device-property?product_id=${PRODUCT_ID}&device_name=${DEVICE_NAME}`;

      try {
        const response = await fetch(url, {
          method: "GET",
          headers: {
            "authorization": TOKEN
          }
        });

        const result = await response.json();

        if (result.code === 0 && Array.isArray(result.data)) {
          errorBox.style.display = "none";
          statusBadge.textContent = "在线正常";
          statusBadge.className = "badge";

          const dataMap = {};
          result.data.forEach(item => {
            dataMap[item.identifier] = item.value;
          });

          const pct = Number(dataMap.pct ?? 0);
          const dist = dataMap.dist ?? "--";
          const vbat = dataMap.vbat ?? "--";
          const rssi = dataMap.rssi ?? "--";
          const err = Number(dataMap.err ?? 0);

          document.getElementById("pctText").textContent = pct + "%";
          document.getElementById("distVal").textContent = dist + " mm";
          document.getElementById("vbatVal").textContent = vbat + " mV";
          document.getElementById("rssiVal").textContent = rssi + " dBm";
          document.getElementById("errVal").textContent = err === 0 ? "正常 (0)" : "异常 (1)";

          const fillEl = document.getElementById("binFill");
          fillEl.style.height = Math.min(Math.max(pct, 0), 100) + "%";
          if (pct >= 85) {
            fillEl.style.backgroundColor = "#ef4444";
          } else if (pct >= 60) {
            fillEl.style.backgroundColor = "#f59e0b";
          } else {
            fillEl.style.backgroundColor = "#22c55e";
          }

          if (err !== 0) {
            statusBadge.textContent = "传感器异常";
            statusBadge.className = "badge error";
          }

          const now = new Date();
          document.getElementById("updateTime").textContent = "上次更新：" + now.toLocaleTimeString();
        } else {
          throw new Error(result.msg || "平台返回数据异常");
        }
      } catch (err) {
        statusBadge.textContent = "请求失败";
        statusBadge.className = "badge error";
        errorBox.style.display = "block";
        errorBox.textContent = "读取失败：" + err.message + "（如果是浏览器安全拦截或权限不足，请看说明排查）";
      }
    }

    fetchData();
    setInterval(fetchData, 5000);
  </script>
</body>
</html>
